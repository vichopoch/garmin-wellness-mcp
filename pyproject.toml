[build-system]
requires = [ "hatchling==1.32.4",]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect==0.3.17",
    "requests==2.33.0",
    # mcp 2.x renamed mcp.server.fastmcp -> mcp.server.mcpserver (FastMCP ->
    # MCPServer). Cap until the server is ported to the new API.
    "mcp==1.28.1",
    "fitparse==1.2.0",
    "SQLAlchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "PyJWT[crypto]==2.15.1",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-mcp-auth = "garmin_mcp.wellness_auth:main"
garmin-wellness = "garmin_mcp.runtime:main"
garmin-sync = "garmin_mcp.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
]

